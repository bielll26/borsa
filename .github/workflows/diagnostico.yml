name: Diagnóstico de proveedores

# Se lanza a mano (pestaña Actions) para comprobar si los proveedores de datos
# responden desde los runners de GitHub.
on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/diagnostico_proveedores.py
