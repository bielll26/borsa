name: Escaneo diario y publicación

# El panel calcula el intradía en el navegador de quien lo abre (Yahoo responde
# 429 a las IP de los centros de datos, incluidas las de GitHub). Aquí solo se
# escanea el cierre diario desde la fuente de respaldo, se acumula en el
# histórico del repositorio y se publica el panel.
on:
  schedule:
    - cron: "30 17 * * 1-5" # ~19:30 en Madrid, con la sesión ya cerrada
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/moving-average-crossover-app-9vuqjc

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  escanear:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pruebas
        run: python -m unittest discover -s tests -t .

      - name: Escanear el cierre diario
        run: |
          python -m scanner.scan --universo todos --timeframes 1d \
            --salida docs/data --historico datos/historico --resumen

      - name: Resumen del escaneo
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          indice = json.loads(pathlib.Path("docs/data/index.json").read_text())
          print(f"### Escaneo {indice['generatedAt']}\n")
          print("| Marco | Sesión | Con cruce | Valores | Sin datos |")
          print("|---|---|---:|---:|---:|")
          for tf in indice["timeframes"]:
              print(f"| {tf['label']} | {tf['session']} | {tf['withCrosses']} | {tf['count']} | {tf['errors']} |")
          historico = sorted(pathlib.Path("datos/historico").glob("*.csv"))
          if historico:
              sesiones = [sum(1 for _ in f.open()) - 1 for f in historico]
              print(f"\nHistórico acumulado: {len(historico)} valores · "
                    f"{min(sesiones)}–{max(sesiones)} sesiones por valor "
                    f"(hacen falta 51 para la media de 50 y 201 para la de 200).")
          PY

      # El histórico crece con cada escaneo: es lo que permite que el panel
      # publicado acabe detectando también los cruces de 50 y 200.
      - name: Guardar el histórico acumulado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/historico
          if git diff --cached --quiet; then
            echo "El histórico no ha cambiado."
          else
            git commit -m "Histórico diario $(date -u +%Y-%m-%d)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # El token de Actions no puede crear el sitio de Pages, así que la primera
      # vez hay que activarlo a mano. Mientras tanto el escaneo y el histórico
      # siguen funcionando: solo se salta la publicación.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs

      - name: Recordatorio si Pages no está activado
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Panel sin publicar. Actívalo en Settings → Pages → Build and deployment → Source: GitHub Actions y vuelve a lanzar este flujo."

  publicar:
    needs: escanear
    if: needs.escanear.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
